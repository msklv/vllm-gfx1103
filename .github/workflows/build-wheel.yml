name: build vLLM ROCm wheel (gfx1103)

on:
  workflow_dispatch:
    inputs:
      vllm_ref:
        description: "vLLM tag/commit to build"
        default: "v0.25.1"
        required: true
      base_image:
        description: "ROCm base image (needs ROCm >= 7.1 for gfx1103 rocBLAS kernels)"
        default: "rocm/vllm-dev:base"
        required: true
      arch:
        description: "PYTORCH_ROCM_ARCH (LLVM target of the iGPU)"
        default: "gfx1103"
        required: true
      max_jobs:
        description: "MAX_JOBS for the HIP/C++ build"
        default: "4"
        required: true
      publish_release:
        description: "Publish wheel + MANIFEST to a GitHub Release (permanent, unlike artifacts)"
        type: boolean
        default: true
      release_tag:
        description: "Release tag override (default: build-<vllm_ref>-rocm<ver>-<arch>)"
        default: ""
        required: false

permissions:
  contents: write

env:
  VLLM_SRC: vllm-src

jobs:
  build-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Disk before build
        run: df -h /

      - name: Clone vLLM ref
        run: |
          git clone --depth 1 --branch "${{ inputs.vllm_ref }}" https://github.com/vllm-project/vllm.git "$VLLM_SRC"
          git -C "$VLLM_SRC" log -1 --format='source commit: %H %s'

      - name: Report base image toolchain
        run: |
          set -uo pipefail
          rocm=$(docker run --rm "${{ inputs.base_image }}" python3 -c "import re,torch;m=re.search(r'\+rocm([0-9.]+)', torch.__version__);print(m.group(1) if m else '')" 2>/dev/null || true)
          torch=$(docker run --rm "${{ inputs.base_image }}" python3 -c 'import torch;print(torch.__version__+" (hip "+str(torch.version.hip)+")")' 2>/dev/null || echo absent)
          printf 'base_image=%s\nrocm=%s\ntorch=%s\n' "${{ inputs.base_image }}" "${rocm:-unknown}" "$torch" | tee toolchain.txt
          echo "ROCm (из torch): ${rocm:-unknown}"
          echo "torch: $torch"
          if [ -z "$rocm" ]; then
            echo "::error::не удалось определить версию ROCm из torch — тег релиза будет некорректным, останавливаюсь"
            exit 1
          fi

      - name: Build ROCm wheel (target export_vllm)
        working-directory: ${{ env.VLLM_SRC }}
        run: |
          set -euo pipefail
          docker buildx create --name gfx --driver docker-container --use
          docker buildx build \
            --target export_vllm \
            --build-arg BASE_IMAGE="${{ inputs.base_image }}" \
            --build-arg ARG_PYTORCH_ROCM_ARCH="${{ inputs.arch }}" \
            --build-arg MAX_JOBS="${{ inputs.max_jobs }}" \
            --output type=local,dest=./out \
            -f docker/Dockerfile.rocm .
          df -h /

      - name: Collect wheel
        run: |
          set -euo pipefail
          mkdir -p wheel
          find "$VLLM_SRC/out" -name '*.whl' -exec cp -v {} wheel/ \;
          ls -l wheel/

      - name: Manifest and checksums
        run: |
          set -euo pipefail
          whl=$(ls wheel/*.whl | head -1)
          sha=$(sha256sum "$whl" | cut -d' ' -f1)
          size=$(stat -c%s "$whl")
          {
            echo "wheel:          $(basename "$whl")"
            echo "sha256:         $sha"
            echo "size:           $size bytes"
            echo "license:        Apache-2.0"
            echo "source ref:     ${{ inputs.vllm_ref }}"
            echo "source commit:  $(git -C "$VLLM_SRC" rev-parse HEAD)"
            echo "build base:     $(grep '^base_image=' toolchain.txt | cut -d= -f2-)"
            echo "rocm:           $(grep '^rocm=' toolchain.txt | cut -d= -f2-)"
            echo "torch:          $(grep '^torch=' toolchain.txt | cut -d= -f2-)"
            echo "build arch:     ${{ inputs.arch }}  (PYTORCH_ROCM_ARCH)"
            echo "build host:     GitHub Actions ${RUNNER_OS}/${RUNNER_ARCH}, run ${{ github.run_id }}"
            echo ""
            echo "Upstream vLLM does not officially support gfx1103. The wheel is not smoke-tested on"
            echo "hardware (CI runner has no GPU). See docs/run-on-780m.md before the first run."
          } > wheel/MANIFEST.txt
          sha256sum wheel/MANIFEST.txt
          cat wheel/MANIFEST.txt

      - name: Upload wheel artifact (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: vllm-rocm-${{ inputs.arch }}-${{ inputs.vllm_ref }}
          path: |
            wheel/*.whl
            wheel/MANIFEST.txt
          retention-days: 30

      - name: Publish GitHub Release (permanent)
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then
            rocm=$(grep '^rocm=' toolchain.txt | cut -d= -f2- | tr -d '[:space:]')
            tag="build-${{ inputs.vllm_ref }}-rocm${rocm:-unknown}-${{ inputs.arch }}"
          fi
          title="vLLM ${{ inputs.vllm_ref }} + ROCm/${{ inputs.arch }} wheel"
          base=$(grep '^base_image=' toolchain.txt | cut -d= -f2-)
          tor=$(grep '^torch=' toolchain.txt | cut -d= -f2-)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists — assets will be replaced"
          else
            gh release create "$tag" --title "$title" --notes "wheel for ${{ inputs.arch }}; see MANIFEST.txt"
          fi
          gh release upload "$tag" wheel/*.whl wheel/MANIFEST.txt --clobber
          gh release edit "$tag" --title "$title" --notes "$(printf '%s\n\n' \
            "Wheel собран из апстрима \`vllm-project/vllm\` на тег \`${{ inputs.vllm_ref }}\` под \`${{ inputs.arch }}\`." \
            "- база: \`${base}\` — ROCm $(grep '^rocm=' toolchain.txt | cut -d= -f2-), torch ${tor}" \
            "- CI: run ${{ github.run_id }}, $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "- на железе не проверялся: у раннера нет GPU, порядок запуска — \`docs/run-on-780m.md\`" \
            "" "sha256 и требования — в \`MANIFEST.txt\`.")"
          gh release view "$tag" --json tagName,url --jq '"release: \(.url)"'

